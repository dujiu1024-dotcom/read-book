name: PC reading prototype

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "prototypes/pc-reading/**"
      - ".github/workflows/pc-reading-prototype.yml"
  pull_request:
    paths:
      - "prototypes/pc-reading/**"
      - ".github/workflows/pc-reading-prototype.yml"

permissions:
  contents: read

concurrency:
  group: pc-reading-prototype-${{ github.ref }}
  cancel-in-progress: false

jobs:
  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install prototype dependencies from lockfile
        working-directory: prototypes/pc-reading
        run: npm ci
      - name: Check prototype JavaScript syntax
        run: node --check prototypes/pc-reading/app.js
      - name: Run all prototype unit tests
        run: node --experimental-strip-types --test prototypes/pc-reading/*.test.mjs
      - name: Check public provider JavaScript syntax
        run: node --check prototypes/pc-reading/public-book-content-provider.js
      - name: Install pinned browser test dependency
        run: npm install --no-save playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser interaction smoke tests
        run: node prototypes/pc-reading/smoke-test.mjs

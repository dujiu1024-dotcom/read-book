name: Local repository contract tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "packages/local-repository-contract/**"
      - ".github/workflows/local-repository-contract.yml"
  pull_request:
    paths:
      - "packages/local-repository-contract/**"
      - ".github/workflows/local-repository-contract.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run local repository contract tests
        working-directory: packages/local-repository-contract
        run: npm test

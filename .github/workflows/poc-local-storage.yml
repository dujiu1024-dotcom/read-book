name: PoC A - Local Storage

on:
  pull_request:
    paths:
      - "poc/local-storage/**"
      - ".github/workflows/poc-local-storage.yml"
  push:
    branches:
      - "poc/issue-1-local-storage"
    paths:
      - "poc/local-storage/**"
      - ".github/workflows/poc-local-storage.yml"

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: poc/local-storage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: poc/local-storage/package-lock.json
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run build
      - run: npm test

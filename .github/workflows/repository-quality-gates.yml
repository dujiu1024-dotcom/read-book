name: Repository quality gates

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: repository-quality-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
      - name: Check Markdown internal links
        run: node scripts/check-markdown-links.mjs
      - name: Parse JSON and JSONL files
        run: node scripts/validate-json-files.mjs
      - name: Install package validator dependencies
        working-directory: packages/book-package-validator
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate book package processing contract
        working-directory: packages/book-package-validator
        run: npm run validate:processing-contract
      - name: Run book package validator fixtures
        working-directory: packages/book-package-validator
        run: npm test
      - name: Lint OpenAPI 3.1 contract
        run: npx --yes @redocly/cli@1.27.1 lint --config .redocly.yaml docs/api-contract.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned contract validator dependencies
        run: python -m pip install openapi-spec-validator==0.7.2 PyYAML==6.0.2
      - name: Validate state machine, data dictionary and OpenAPI contract
        run: python tools/contract_validation/validate_state_machine_contract.py
      - name: Run encrypted backup PoC tests
        working-directory: poc/encrypted-backup
        run: node --test
      - name: Verify dependency lockfiles exist
        run: |
          for package in packages/*/package.json poc/*/package.json prototypes/pc-reading/package.json; do
            directory="$(dirname "$package")"
            if node -e "const p=require('./$package'); process.exit(Object.keys(p.dependencies||{}).length ? 0 : 1)"; then
              test -f "$directory/package-lock.json" || { echo "Missing lockfile: $directory/package-lock.json"; exit 1; }
            fi
          done
